<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:13px/1.4 system-ui,sans-serif;background:#fff;color:#1e1e1e}
h3{margin:0;padding:18px 32px 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#646970}
.row{display:flex;gap:44px;align-items:flex-end;padding:18px 32px 26px}
.row.grey{background:#f0f0f1}
.row.dark{background:#1d2327;color:#f0f0f1}
figure{margin:0;text-align:center}
figcaption{margin-top:9px;font-size:11px;opacity:.7}
img{display:block}
</style></head><body>
<h3>A — calendar</h3>
<div class="row"><figure><img src="../.wordpress-org/icon.svg" width="200"><figcaption>200</figcaption></figure>
<figure><img src="../.wordpress-org/icon.svg" width="128"><figcaption>128 · plugin card</figcaption></figure>
<figure><img src="../.wordpress-org/icon.svg" width="64"><figcaption>64</figcaption></figure>
<figure><img src="../.wordpress-org/icon.svg" width="40"><figcaption>40 · plugins list</figcaption></figure>
<figure><img src="../.wordpress-org/icon.svg" width="24"><figcaption>24</figcaption></figure></div>
<h3>B — calendar with a clock badge</h3>
<div class="row"><figure><img src="icon-option-a-calendar.svg" width="200"><figcaption>200</figcaption></figure>
<figure><img src="icon-option-a-calendar.svg" width="128"><figcaption>128 · plugin card</figcaption></figure>
<figure><img src="icon-option-a-calendar.svg" width="64"><figcaption>64</figcaption></figure>
<figure><img src="icon-option-a-calendar.svg" width="40"><figcaption>40 · plugins list</figcaption></figure>
<figure><img src="icon-option-a-calendar.svg" width="24"><figcaption>24</figcaption></figure></div>
<div class="row grey"><figure><img src="../.wordpress-org/icon.svg" width="128"><figcaption>A on #f0f0f1</figcaption></figure>
<figure><img src="icon-option-a-calendar.svg" width="128"><figcaption>B on #f0f0f1</figcaption></figure></div>
<div class="row dark"><figure><img src="../.wordpress-org/icon.svg" width="128"><figcaption>A on dark</figcaption></figure>
<figure><img src="icon-option-a-calendar.svg" width="128"><figcaption>B on dark</figcaption></figure></div>
</body></html>
